<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg6)"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#1e293b" stroke-width="1" rx="14"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="46" fill="#090d16" fill-opacity="0.9"/>
  <line x1="0" y1="46" x2="800" y2="46" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="23" r="5" fill="#ef4444"/>
  <circle cx="40" cy="23" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="23" r="5" fill="#10b981"/>
  <text x="80" y="27" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">COMPLIANCE GATEWAY &bull; HUMAN-IN-THE-LOOP APPROVAL</text>

  <rect x="625" y="13" width="150" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="639" cy="24" r="3.5" fill="#f59e0b"/>
  <text x="649" y="27.5" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">REQUIRES HUMAN SIGN-OFF</text>

  <!-- Modal Card -->
  <g transform="translate(30, 66)">
    <rect x="0" y="0" width="740" height="380" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.2"/>

    <!-- Order Header -->
    <rect x="0" y="0" width="740" height="60" rx="10" fill="#1e293b" fill-opacity="0.6"/>
    <text x="24" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">EXCEPTION TRIGGER #EXP-9842</text>
    <text x="24" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Apex Industrial Distribution &bull; Order #ORD-88219</text>
    <text x="560" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">$148,500.00</text>

    <!-- Trigger Reason -->
    <g transform="translate(24, 85)">
      <rect x="0" y="0" width="692" height="70" rx="8" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
      <text x="20" y="28" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">&excl; AUTOMATED SAFETY INTERCEPT</text>
      <text x="20" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">
        Custom Volume Discount of 18.5% exceeds automated threshold (15.0%). Routed to VP Sales for human authorization.
      </text>
    </g>

    <!-- Details Grid -->
    <g transform="translate(24, 180)">
      <rect x="0" y="0" width="336" height="80" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ORACLE GL POSTING TARGET</text>
      <text x="16" y="52" fill="#ffffff" font-family="monospace" font-size="13">EBS_122.AP_INVOICES_ALL</text>

      <rect x="356" y="0" width="336" height="80" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
      <text x="372" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AUDIT LEDGER REFERENCE</text>
      <text x="372" y="52" fill="#34d399" font-family="monospace" font-size="13">IMMUTABLE_HASH #7821-AF</text>
    </g>

    <!-- Human Action Buttons -->
    <g transform="translate(24, 285)">
      <!-- Approve Button -->
      <rect x="0" y="0" width="336" height="52" rx="8" fill="#10b981"/>
      <text x="75" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">&check; APPROVE &amp; COMMIT TO ERP</text>

      <!-- Reject Button -->
      <rect x="356" y="0" width="336" height="52" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
      <text x="440" y="32" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">&cross; REJECT WITH REASON</text>
    </g>

    <text x="24" y="365" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">
      Principle 05: Human-in-the-Loop Safeguards &bull; Nothing commits to your books without human authority.
    </text>
  </g>
</svg>