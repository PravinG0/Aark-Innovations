    <text x="276" y="74" fill="#94a3b8" font-family="monospace" font-size="10">&bull; Auto-deduplication: PASS</text>
    <text x="276" y="92" fill="#94a3b8" font-family="monospace" font-size="10">&bull; Schema drift: 0 defects</text>

    <!-- Arrow 2 -->
    <line x1="480" y1="55" x2="520" y2="55" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="520,55 512,50 512,60" fill="#10b981"/>

