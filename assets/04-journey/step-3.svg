    <text x="140" y="62" fill="#ffffff" font-family="monospace" font-size="11">ORCL_EBS.GL_BALANCES</text>
    <text x="310" y="62" fill="#60a5fa" font-family="monospace" font-size="11">SNOW_GOLD.DIM_FINANCE</text>
    <text x="490" y="62" fill="#34d399" font-family="monospace" font-size="11">0.38s</text>
    <text x="610" y="62" fill="#10b981" font-family="monospace" font-size="11">&check; RECONCILED</text>
    <line x1="20" y1="78" x2="720" y2="78" stroke="#1e293b" stroke-width="1"/>

    <text x="20" y="106" fill="#94a3b8" font-family="monospace" font-size="11">TX-984103</text>
    <text x="140" y="106" fill="#ffffff" font-family="monospace" font-size="11">ORCL_EBS.AP_INVOICES</text>
    <text x="310" y="106" fill="#60a5fa" font-family="monospace" font-size="11">SNOW_GOLD.FCT_PAYABLES</text>
    <text x="490" y="106" fill="#34d399" font-family="monospace" font-size="11">0.42s</text>
    <text x="610" y="106" fill="#10b981" font-family="monospace" font-size="11">&check; RECONCILED</text>
    <line x1="20" y1="122" x2="720" y2="122" stroke="#1e293b" stroke-width="1"/>

    <text x="20" y="150" fill="#94a3b8" font-family="monospace" font-size="11">TX-984104</text>
    <text x="140" y="150" fill="#ffffff" font-family="monospace" font-size="11">SFDC_CRM.OPPORTUNITY</text>
    <text x="310" y="150" fill="#60a5fa" font-family="monospace" font-size="11">SNOW_GOLD.DIM_REVENUE</text>
    <text x="490" y="150" fill="#34d399" font-family="monospace" font-size="11">0.29s</text>
    <text x="610" y="150" fill="#10b981" font-family="monospace" font-size="11">&check; RECONCILED</text>

