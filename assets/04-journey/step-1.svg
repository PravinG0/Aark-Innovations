    <text x="520" y="206" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">15.5 hrs</text>
    <rect x="635" y="192" width="85" height="22" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="645" y="207" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CRITICAL</text>
